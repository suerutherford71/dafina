# Publishes the website/ folder to https://suerutherford71.github.io/dafina/
# whenever main changes. Turn it on once: repo Settings › Pages › Source: GitHub Actions.
# Build and deploy are separate jobs (GitHub's own recommended setup): the
# deploy step sometimes can't see the uploaded site if both run in one job.
name: Publish website
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
